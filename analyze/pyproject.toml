[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vh-analyze"
version = "0.2.0"
description = "video-harness analysis layer on top of rea-video: layout-aware cuts, visual beats, narration anchoring, design palette, cross-video profiles."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
local-asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["vh_analyze"]
