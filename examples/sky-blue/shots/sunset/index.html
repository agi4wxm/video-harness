<!doctype html>
<!-- html 镜头：日落。Canvas 2D，所有状态由 seek(t) 决定。 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get("w") || 1920, H = +q.get("h") || 1080, D = +q.get("duration") || 8;
  const c = document.getElementById("c"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => x * x * (3 - 2 * x);
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;
  function draw(t) {
    const k = ease(clamp(t / (D * 0.75)));
    const top = mix([86, 140, 230], [58, 34, 96], k), low = mix([190, 214, 245], [240, 120, 70], k);
    const sky = g.createLinearGradient(0, 0, 0, H * 0.78);
    sky.addColorStop(0, rgb(top)); sky.addColorStop(1, rgb(low));
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    // 太阳下沉
    const sy = H * (0.25 + 0.5 * k), sr = H * 0.09;
    g.save(); g.shadowColor = rgb(mix([255, 240, 200], [255, 110, 60], k)); g.shadowBlur = 80;
    g.fillStyle = rgb(mix([255, 246, 214], [255, 140, 80], k)); g.beginPath(); g.arc(W * 0.7, sy, sr, 0, 6.283); g.fill(); g.restore();
    // 光穿过的空气层：太阳越低，路径越长
    g.strokeStyle = "rgba(255,255,255,0.55)"; g.lineWidth = H * 0.006; g.setLineDash([H * 0.02, H * 0.015]);
    g.lineDashOffset = -t * H * 0.06;
    g.beginPath(); g.moveTo(W * 0.7, sy); g.lineTo(W * 0.3, H * 0.74); g.stroke(); g.setLineDash([]);
    // 地面与观察者
    g.fillStyle = rgb(mix([96, 150, 96], [60, 50, 70], k)); g.fillRect(0, H * 0.76, W, H * 0.24);
    g.fillStyle = "#2B2140"; g.beginPath(); g.ellipse(W * 0.3, H * 0.72, H * 0.035, H * 0.05, 0, 0, 6.283); g.fill();
    // 标签：路径长度
    const lk = clamp((t - 1.0) / 0.5);
    // 标签放在深色半透明底上，天空亮暗变化时都清楚
    const label = k < 0.5 ? "short path" : "long path through air", fs = Math.round(H * 0.045);
    g.font = `700 ${fs}px Fredoka, sans-serif`;
    const tw = g.measureText(label).width, pad = fs * 0.45;
    g.globalAlpha = lk; g.fillStyle = "rgba(30,21,70,0.78)";
    g.beginPath(); g.roundRect(W * 0.08 - pad, H * 0.14 - fs - pad * 0.6, tw + 2 * pad, fs * 1.25 + pad * 1.2, fs * 0.4); g.fill();
    g.fillStyle = "#FFFFFF"; g.fillText(label, W * 0.08, H * 0.14 - fs * 0.12); g.globalAlpha = 1;
  }
  window.__vh = {
    isReady: () => document.fonts.status === "loaded",
    seek: (t) => draw(t),
    inspect: (t) => { const k = ease(clamp(t / (D * 0.75))); const s = Math.round(H * 0.045); const text = k < 0.5 ? "short path" : "long path through air";
      return [{ type: "text", id: "path-label", text, font: "display", size: s, weight: 700, color: "#FFFFFF", x: W * 0.08, y: H * 0.14 - s, w: text.length * s * 0.55, h: s * 1.25, opacity: clamp((t - 1.0) / 0.5), role: "label", on: "#1E1546" }]; },
  };
</script></body></html>
