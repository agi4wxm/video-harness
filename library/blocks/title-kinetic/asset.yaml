id: block/title-kinetic@0.1.0
kind: block
title: 大字标题
summary: 1–3 行大字逐字 / 逐行 / 整体入场，强调词变色并弹一下；可带一行副标题
tags:
  shot_type: [kinetic-text, quote]
  metaphor: [none]
  emphasis_treatment: [scale, color]
  aspect: ["9:16", "16:9"]
entry: ./index.tsx
params_schema: ./schema.ts
constraints:
  duration_s: [1.2, 4.0]
  max_per_minute: 3
examples:
  - name: 开场提问
    duration_s: 2.5
    params:
      lines: ["充到 80% 以后", "为什么变慢了？"]
      emphasis: ["80%"]
      mode: chars
  - name: 结论金句
    duration_s: 2.5
    params:
      lines: ["慢，是为了", "让电池更长寿"]
      emphasis: ["更长寿"]
      subtitle: Battery Health
      mode: lines
implements: [recipe/hook-question]
provenance:
  source: self-made
  license: 自有
  reference: analysis/chaping（kinetic-text 段、scale 强调）
quality:
  status: draft
  uses: 0
  p0_rate: null
