id: block/footage-window@0.1.0
kind: block
title: 素材窗口
summary: 图片或视频填满内容区，缓慢推拉 / 平移，可在指定时刻弹出标注、描出高亮框
tags:
  shot_type: [live-footage, screenshot, generative-footage]
  metaphor: [zoom-detail, none]
  emphasis_treatment: [box, motion-pop]
  aspect: ["9:16", "16:9"]
entry: ./index.tsx
params_schema: ./schema.ts
constraints:
  duration_s: [1.0, 5.0]
examples:
  - name: 充电特写
    duration_s: 3.0
    params:
      src: assets/media.image/phone-charging/phone-charging.webp
      move: in
      focus: { x: 0.5, y: 0.45 }
      callouts:
        - { at: 0.8, text: "80%", x: 0.5, y: 0.3, color: accent2 }
deps: [media.image/phone-charging@0.1.0]
implements: [recipe/literal-illustration]
provenance:
  source: self-made
  license: 自有
  reference: analysis/chaping（live-footage 段 46%：一句话一画面的直译）
quality:
  status: draft
  uses: 0
  p0_rate: null
